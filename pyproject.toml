[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "character-mosaic-censor"
version = "1.0.0"
description = "Local Windows GUI for recall-oriented censoring of sensitive regions in anime/CG images"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["anime", "image-processing", "computer-vision", "onnx", "pyside6", "mosaic"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10,<3.14"
dependencies = [
  "dghs-imgutils==0.19.0",
  "Pillow>=11.0,<13",
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]

[project.urls]
Homepage = "https://github.com/umimi893/character-mosaic-censor"
Source = "https://github.com/umimi893/character-mosaic-censor"

[project.scripts]
character-mosaic = "character_mosaic.cli:main"

[project.gui-scripts]
character-mosaic-gui = "character_mosaic.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
